<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="490"
     height="520"
     viewBox="0 0 490 520">

<style>
    .title {
        font-family: monospace;
        font-size: 22px;
        font-weight: bold;
        fill: #58a6ff;
    }

    .key {
        font-family: monospace;
        font-size: 16px;
        font-weight: bold;
        fill: #7ee787;
    }

    .value {
        font-family: monospace;
        font-size: 16px;
        fill: #c9d1d9;
    }

    .line {
        opacity: 0;
        animation: appear 0.45s ease-out forwards;
    }

    @keyframes appear {
        from {
            opacity: 0;
            transform: translateX(15px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }
</style>

