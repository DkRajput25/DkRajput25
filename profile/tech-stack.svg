<style>

.card {
    fill: #0d1117;
    stroke: #30363d;
    stroke-width: 1.5;
    opacity: 0;
    animation: appear 0.6s ease-out forwards;
}

.icon {
    fill: #58a6ff;
    font-family: Arial, sans-serif;
    font-size: 25px;
    font-weight: bold;
}

.name {
    fill: #c9d1d9;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: 600;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

</style>

