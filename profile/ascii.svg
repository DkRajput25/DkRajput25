<style>

.ascii {
    font-family: "Courier New", monospace;
    font-size: 11px;
    font-weight: bold;
    fill: #c9d1d9;
}

.row {
    opacity: 0;
    animation: reveal 0.4s ease-out forwards;
}

@keyframes reveal {
    from {
        opacity: 0;
        transform: translateX(-15px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

</style>

